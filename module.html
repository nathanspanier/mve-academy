<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVE Academy</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { min-height: 100vh; padding-bottom: 96px; }

/* ─── TOPBAR ──────────────────────────────────────────────────── */
.tb-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.home-link {
  font-size: 11px; color: var(--text-4); text-decoration: none;
  display: flex; align-items: center; gap: 4px;
  transition: color 0.12s;
}
.home-link:hover { color: var(--text-2); }
.home-link::before { content: '←'; }
.tb-divider { color: var(--border-strong); font-size: 14px; }
.tb-title { font-size: 14px; font-weight: 500; color: var(--text-1); letter-spacing: -0.2px; }
.tb-title .id { font-family: var(--font-mono); font-size: 12px; color: var(--text-4); margin-right: 6px; }
.tb-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.prog { display: flex; align-items: center; gap: 10px; }
.prog-text { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog-text strong { color: var(--text-1); font-weight: 600; }
.prog-bar { width: 90px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }

/* ─── MAIN ────────────────────────────────────────────────────── */
.main { max-width: 720px; margin: 0 auto; padding: 40px 24px 24px; }

/* ─── BRIEFING ────────────────────────────────────────────────── */
.briefing {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-left: 3px solid var(--purple-deep);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 36px;
  box-shadow: var(--shadow-sm);
}
.briefing-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-4); margin-bottom: 10px; }
.briefing h2 { font-size: 22px; font-weight: 500; letter-spacing: -0.4px; line-height: 1.2; margin-bottom: 12px; color: var(--text-1); }
.briefing-body p { font-size: 14px; color: var(--text-2); line-height: 1.65; margin-bottom: 10px; }
.briefing-body p:last-child { margin-bottom: 14px; }
.briefing-meta { font-size: 12px; color: var(--text-4); display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 0.5px dashed var(--border); }
.briefing-meta .dot { width: 3px; height: 3px; background: var(--text-4); border-radius: 50%; }

/* ─── STEPS ───────────────────────────────────────────────────── */
.steps { position: relative; }
.steps::before {
  content: ''; position: absolute;
  left: 19px; top: 12px; bottom: 12px;
  width: 1px; background: var(--border); z-index: 0;
}
.step {
  position: relative; display: grid;
  grid-template-columns: 40px 1fr; gap: 16px; padding: 12px 0; z-index: 1;
}
.step-num {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: var(--text-3);
  flex-shrink: 0; transition: all 0.25s ease; position: relative; z-index: 2;
}
.step-card { background: transparent; padding: 7px 0 4px; cursor: pointer; user-select: none; -webkit-user-select: none; min-width: 0; }
.step-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.step-title { font-size: 14px; font-weight: 500; color: var(--text-1); letter-spacing: -0.1px; }
.step-meta { font-size: 11px; color: var(--text-4); font-variant-numeric: tabular-nums; }
.step-tag { font-size: 9px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--amber-soft); color: var(--amber-deep); }
.step-tag.optional { background: var(--surface-2); color: var(--text-3); }
.step-body-wrap { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, opacity 0.2s ease; opacity: 0; }
.step-body { padding: 14px 0 4px; font-size: 13.5px; line-height: 1.65; color: var(--text-2); }
.step-body p { margin-bottom: 10px; }
.step-body p:last-child { margin-bottom: 0; }

.step-code-wrap { position: relative; margin: 12px 0; }
.step-code {
  background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 8px;
  padding: 14px 48px 14px 16px; font-family: var(--font-mono); font-size: 12px;
  line-height: 1.65; color: var(--text-1); overflow-x: auto;
  white-space: pre-wrap; word-break: break-all;
}
.copy-btn {
  position: absolute; top: 8px; right: 8px;
  background: var(--surface); border: 0.5px solid var(--border); border-radius: 5px;
  padding: 4px 8px; font-size: 10px; font-weight: 500; color: var(--text-3);
  cursor: pointer; transition: all 0.12s; font-family: inherit;
}
.copy-btn:hover { color: var(--text-1); border-color: var(--border-strong); }
.copy-btn.copied { background: var(--green); color: white; border-color: var(--green); }

.step-notes { margin: 12px 0 4px; padding: 0; list-style: none; }
.step-notes li { font-size: 13px; color: var(--text-2); padding: 6px 0 6px 22px; position: relative; line-height: 1.55; }
.step-notes li::before { content: '·'; position: absolute; left: 8px; top: 5px; font-weight: bold; color: var(--text-4); }

.step-verify {
  margin-top: 14px; padding: 11px 14px;
  background: var(--green-bg); border-left: 2px solid var(--green);
  border-radius: 0 6px 6px 0; font-size: 12.5px; color: var(--text-2); line-height: 1.55;
}
.step-verify strong { color: var(--green-deep); font-weight: 600; }
.step-verify code { background: rgba(0,0,0,0.04); padding: 1px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 11.5px; }

.step-trouble {
  margin-top: 8px; padding: 11px 14px;
  background: var(--amber-bg); border-left: 2px solid var(--amber);
  border-radius: 0 6px 6px 0; font-size: 12.5px; color: var(--text-2); line-height: 1.55;
}
.step-trouble strong { color: var(--amber-deep); font-weight: 600; }
.step-trouble code { background: rgba(0,0,0,0.04); padding: 1px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 11.5px; }

/* ─── Try-cue (amber action prompt above code) ─────────────── */
.try-cue { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.try-cue-badge {
  background: var(--amber-soft);
  color: var(--amber-deep);
  border: 0.5px solid var(--amber);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 3px 10px; border-radius: 4px;
}
.try-cue-text { font-size: 13px; color: var(--text-2); }

/* ─── Command notes (per-command/per-variable cards) ────────── */
.cmd-notes { margin: 0 0 4px; }
.cmd-note {
  padding: 10px 14px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  margin: 0 0 8px;
}
.cmd-note:last-child { margin-bottom: 0; }
.cmd-note-key {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--amber-deep);
  font-weight: 500;
  margin-bottom: 4px;
}
.cmd-note-what { font-size: 13px; color: var(--text-1); line-height: 1.55; margin: 0 0 4px; }
.cmd-note-when { font-size: 12.5px; color: var(--text-3); line-height: 1.55; margin: 0; }
.cmd-note-when strong {
  font-weight: 500;
  color: var(--text-2);
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  margin-right: 6px;
}
.cmd-note code { background: rgba(0,0,0,0.04); padding: 1px 5px; border-radius: 3px; font-family: var(--font-mono); font-size: 12px; }

/* ─── Scenarios panel (when you'll reach for this) ─────────── */
.step-when {
  margin-top: 12px; padding: 16px 18px;
  background: var(--surface-2); border-radius: 8px;
  font-size: 13px; color: var(--text-2); line-height: 1.6;
}
.step-when-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
.step-when ul { margin: 0; padding: 0; list-style: none; }
.step-when li { font-size: 13px; color: var(--text-2); padding: 5px 0 5px 18px; position: relative; line-height: 1.6; }
.step-when li::before { content: '·'; position: absolute; left: 6px; top: 3px; font-weight: bold; color: var(--text-4); }
.step-when code { background: rgba(0,0,0,0.04); padding: 1px 5px; border-radius: 3px; font-family: var(--font-mono); font-size: 12px; }

@media (prefers-color-scheme: dark) {
  .step-verify code, .step-trouble code, .cmd-note code, .step-when code { background: rgba(255,255,255,0.06); }
}

/* Step states */
.step.is-current .step-num { background: var(--amber-soft); border-color: var(--amber); color: var(--amber-deep); box-shadow: 0 0 0 3px var(--amber-bg); }
.step.is-current .step-title { color: var(--text-1); font-weight: 600; }
.step.is-current .step-body-wrap { max-height: 2000px; opacity: 1; }
.step.is-current .step-card { cursor: default; }
.step.is-done .step-num { background: var(--green); border-color: var(--green); color: white; }
.step.is-done .step-title { color: var(--text-3); }
.step.is-done .step-meta { opacity: 0.6; }
.step.is-upcoming .step-title { color: var(--text-3); }
.step.is-upcoming .step-meta { opacity: 0.7; }
.step.is-upcoming .step-card:hover .step-title { color: var(--text-1); }
.step.is-open .step-body-wrap { max-height: 2000px; opacity: 1; }

.step-foot { margin-top: 14px; padding-top: 12px; border-top: 0.5px dashed var(--border); display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--text-4); }
.step-foot a { color: var(--text-3); cursor: pointer; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 2px; }
.step-foot a:hover { color: var(--text-1); }

/* ─── COMPLETE ────────────────────────────────────────────────── */
.complete-card { margin-top: 32px; padding: 28px; background: var(--green-bg); border: 1px solid var(--green); border-radius: 12px; text-align: center; display: none; }
.complete-card.show { display: block; }
.complete-card h3 { font-size: 18px; font-weight: 500; color: var(--green-deep); margin-bottom: 6px; }
.complete-card p { font-size: 13px; color: var(--text-2); margin-bottom: 16px; }

/* ─── ACTION BAR ──────────────────────────────────────────────── */
.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 0.5px solid var(--border);
  padding: 14px 24px; display: flex; align-items: center;
  justify-content: space-between; gap: 16px; box-shadow: var(--shadow-lg); z-index: 30;
}
.ab-step { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.ab-num { width: 28px; height: 28px; border-radius: 50%; background: var(--amber-soft); color: var(--amber-deep); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.ab-text { min-width: 0; }
.ab-label { font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-4); margin-bottom: 1px; }
.ab-title { font-size: 13px; color: var(--text-1); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-buttons { display: flex; gap: 8px; flex-shrink: 0; }
.ab-buttons .btn { font-size: 13px; padding: 8px 14px; }
.action-bar.is-complete .ab-num { background: var(--green); color: white; }
.action-bar.is-complete .ab-label { color: var(--green-deep); }

/* ─── DRAWER ──────────────────────────────────────────────────── */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.18); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 40; }
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 90vw); background: var(--surface); border-left: 0.5px solid var(--border); transform: translateX(100%); transition: transform 0.32s cubic-bezier(.4,0,.2,1); z-index: 50; display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,0.08); }
.drawer.open { transform: translateX(0); }
.drawer-head { padding: 18px 24px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.drawer-head h2 { font-size: 14px; font-weight: 600; }
.drawer-close { background: transparent; border: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--text-3); padding: 4px 8px; border-radius: 5px; }
.drawer-close:hover { background: var(--surface-2); color: var(--text-1); }
.drawer-body { padding: 20px 24px 32px; overflow-y: auto; flex: 1; }
.ref-section { margin-bottom: 26px; }
.ref-section:last-child { margin-bottom: 0; }
.ref-section h3 { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-4); margin-bottom: 10px; }
.ref-section pre { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 7px; padding: 12px 14px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.7; color: var(--text-1); white-space: pre-wrap; }
.ref-section p { font-size: 12.5px; color: var(--text-2); line-height: 1.6; margin-bottom: 6px; }

/* ─── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width: 640px) {
  .main { padding: 28px 16px 16px; }
  .briefing { padding: 18px; }
  .briefing h2 { font-size: 19px; }
  .step { grid-template-columns: 32px 1fr; gap: 12px; }
  .step-num { width: 32px; height: 32px; font-size: 13px; }
  .steps::before { left: 15px; }
  .action-bar { padding: 10px 14px; gap: 10px; }
  .ab-text { display: none; }
  .ab-buttons .btn { font-size: 12px; padding: 7px 12px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-left">
    <a href="index.html" class="home-link">All modules</a>
    <span class="tb-divider">/</span>
    <span id="tb-phase" class="phase-pill p1">Phase 1</span>
    <div class="tb-title">
      <span class="id" id="tb-module-id">M0</span><span id="tb-module-title">Loading…</span>
    </div>
  </div>
  <div class="tb-right">
    <div class="prog">
      <span class="prog-text"><strong id="done-count">0</strong> / <span id="total-count">—</span></span>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <button class="btn" id="ref-btn">Reference</button>
  </div>
</header>

<main class="main">
  <section class="briefing">
    <div class="briefing-label">Briefing</div>
    <h2 id="briefing-headline">Loading…</h2>
    <div class="briefing-body" id="briefing-body"></div>
    <div class="briefing-meta">
      <span id="briefing-estimate">—</span>
      <span class="dot"></span>
      <span id="briefing-steps">—</span>
      <span class="dot"></span>
      <span id="briefing-prereqs">—</span>
    </div>
  </section>

  <section class="steps" id="steps"></section>

  <div class="complete-card" id="complete-card">
    <h3 id="complete-headline">Module complete.</h3>
    <p id="complete-body"></p>
    <a href="index.html" class="btn btn-primary">Back to all modules →</a>
  </div>
</main>

<footer class="action-bar" id="action-bar">
  <div class="ab-step">
    <div class="ab-num" id="ab-num">1</div>
    <div class="ab-text">
      <div class="ab-label" id="ab-label">Current step</div>
      <div class="ab-title" id="ab-title">—</div>
    </div>
  </div>
  <div class="ab-buttons">
    <button class="btn btn-ghost" id="question-btn">Question?</button>
    <button class="btn btn-primary" id="done-btn">✓ I did it</button>
  </div>
</footer>

<!-- Reference drawer -->
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Reference">
  <div class="drawer-head">
    <h2 id="drawer-title">Reference</h2>
    <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="js/app.js"></script>
<script src="js/labench.js"></script>
</body>
</html>
